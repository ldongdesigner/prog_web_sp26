<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature and Humanity Harmonize</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
</head>

<body>
  <div class="container">
    <h1>Nature and Humanity Harmonize</h1>
    <p class="subtitle">
      Click the buttons or use the keyboard to play nature, humanity, or both together.
    </p>
    <p class="keys">
      Keys: <strong>N</strong> = Nature, <strong>H</strong> = Humanity, <strong>B</strong> = Both, <strong>S</strong> = Stop
    </p>

    <div id="sketch-holder"></div>
  </div>

  <script src="sketch.js"></script>

</html>
